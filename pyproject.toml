[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.1.0"
description = "A provider-agnostic policy and authorization layer for AI agents and AI-native applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentShield contributors" }]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3.0",
]
jev = [
    "typesafe-sdk>=0.7,<1.0",
]
# Scoped to agentshield.providers.openai/.anthropic/.gemini (and
# examples/real_agent_demo.py, which uses them) -- not a dependency of
# agentshield's own __init__.py or of agentshield.agent, which never
# imports an LLM client.
agent-demo = [
    "openai>=3.0,<4.0",
    "anthropic>=1.0,<2.0",
    "google-genai>=2.0,<3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "agentshield[mcp]",
    "agentshield[jev]",
    "agentshield[agent-demo]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires network access and real credentials (e.g. a live GitHub MCP server + GITHUB_PERSONAL_ACCESS_TOKEN, or the real Jev API + TYPESAFE_API_KEY); skips itself automatically when prerequisites are absent, so plain `pytest` stays offline",
]
