[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.1.0"
description = "A provider-agnostic policy and authorization layer for AI agents and AI-native applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentShield contributors" }]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "agentshield[mcp]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
